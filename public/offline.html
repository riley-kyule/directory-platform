<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#171717">
    <title>Offline</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #171717; color: #fafafa; font-family: ui-sans-serif, system-ui, sans-serif; }
        main { width: min(100%, 30rem); padding: 2rem; border: 1px solid #44403c; border-radius: 1rem; background: #292524; text-align: center; box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .35); }
        .mark { width: 3.5rem; height: 3.5rem; margin: 0 auto 1.25rem; border: .7rem solid #fb7185; border-radius: 999px; box-shadow: inset 0 0 0 .35rem #292524; }
        h1 { margin: 0; font-size: 1.75rem; }
        p { margin: .75rem 0 1.5rem; color: #d6d3d1; line-height: 1.6; }
        a { display: inline-block; padding: .8rem 1.15rem; border-radius: 999px; background: #fb7185; color: #171717; font-weight: 800; text-decoration: none; }
        a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true"></div>
        <h1>You're offline</h1>
        <p>Reconnect to continue. For privacy, listings, images, contact details, and account pages are never stored for offline viewing.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
